<html>
  <head>
    <title>Toroids</title>
	<meta charset="utf-8">
	<link rel="icon" type="image/png" href="salas/imagens/icone.png">
	<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
	<script src="https://unpkg.com/aframe-orbit-controls@1.3.0/dist/aframe-orbit-controls.min.js"></script>
	<link href="https://fonts.googleapis.com/css?family=Lato" rel="stylesheet">
	<script src="nomes.js"></script>
	<link rel="stylesheet" href="nomes.css">
 	<script src="https://unpkg.com/aframe-teleport-controls@0.3.x/dist/aframe-teleport-controls.min.js"></script>
  </head>
  <body>
<div style='color:#fada99; position: fixed; bottom: 1vh; left:1vw; width:100%; z-index: 1; font-family: Lato; font-size:2.5vh; font-weight:bold; text-shadow:1px 1px 1px royalblue;'>paulohscwb@gmail.com <br> &copy; 2026 Paulo Henrique Siqueira</div>
    <a-scene renderer="logarithmicDepthBuffer: true; colorManagement: true;">
		<a-assets>
			<a-mixin id="mtl9" material="color: #8ec; side:double;"></a-mixin>
			<a-mixin id="esfera" mixin="mtl9" geometry="radius: 0.01255; segments-height:20; segments-width:20;" material="metalness:0.4; roughness:0.5;">
			<a-asset-item id="material" src="https://paulohscwb.github.io/torus-toroids/hexagonal/vr/obj/c1.mtl"></a-asset-item>
			<a-asset-item id="poli" src="https://paulohscwb.github.io/torus-toroids/iris/vr/obj/AntiEnneagonalIrisToroid.obj"></a-asset-item>
			<a-asset-item id="poliw" visible="false" src="https://paulohscwb.github.io/torus-toroids/iris/vr/obj/AntiEnneagonalIrisToroidL.obj"></a-asset-item>
			<a-mixin id="piso" geometry="width: 40; height: 0.1; depth: 40;" material="opacity:0.01; color: rgb(100,100,100)" static-body shadow></a-mixin>
			<a-mixin id="ar" visible="false" obj-model="obj: #poliw; mtl: #material"></a-mixin>
		</a-assets>
		<a-box mixin="piso" class="piso" visible="false" position="0 -0.05 0"></a-box>
		<a-entity rotation="0 0 0" scale="4.5 4.5 4.5">
			<a-light type="point" color="white" intensity="0.25" position="0 0 0"></a-light>
			<a-obj-model id="fc" scale="0.57 1 0.53" src="#poli" mtl="#material"></a-obj-model>
			<a-entity mixin="ar" scale="0.571 1.001 0.531"></a-entity>
			<a-entity rotation="90 0 90">
				<a-obj-model id="fc" scale="0.57 1 0.53" src="#poli" mtl="#material"></a-obj-model>
				<a-entity mixin="ar" scale="0.571 1.001 0.531"></a-entity>
			</a-entity>
			<a-entity rotation="0 90 90">
				<a-obj-model id="fc" scale="0.57 1 0.53" src="#poli" mtl="#material"></a-obj-model>
				<a-entity mixin="ar" scale="0.571 1.001 0.531"></a-entity>
			</a-entity>
		</a-entity>
		
		<a-box mixin="piso" class="piso" visible="false" position="0 -0.05 0"></a-box>
		<a-entity id="cameraRig" position="0 0 11">
			<a-entity camera="fov:1; near:1;" id="head" orbit-controls="target: 0 0 0; maxPolarAngle: 180; minDistance: 0.5; initialPosition: 165 440 600; maxDistance: 1500;"></a-entity>
			<a-entity teleport-controls="cameraRig: #cameraRig; collisionEntities: [mixin='piso']; teleportOrigin: #head; button: grip;" hand-controls="hand: right"></a-entity>
		</a-entity>
		
		<a-light type="ambient" color="white" intensity="0.4"></a-light>
		<a-light type="directional" color="white" intensity="0.6" position="-3 2 1"></a-light>
		<a-light type="directional" color="white" intensity="0.6" position="-3 -2 -2"></a-light>
		<a-light type="directional" color="white" intensity="0.6" position="3 -2 1"></a-light>
		<a-light type="directional" color="white" intensity="0.6" position="3 2 -2"></a-light>

		<a-sky color="#f0fcfa"></a-sky>
    </a-scene>
	<div class="box">
		<span class="titulo">Borromean rings: polyhedral toroid</span>
		<br><span class="titulo">Anéis Borromeanos: toroide poliédrico</span>
		<hr><input type="checkbox" id="faces" checked onclick="mfaces()">faces&nbsp;&nbsp;&nbsp;  
		<input type="checkbox" id="arestas" onclick="marestas()">edges&nbsp;&nbsp;&nbsp; 
		<input type="checkbox" id="vertices" checked onclick="mvertices()">vertices
	</div>
  </body>
</html>
